[package]
name = "thruline-licence-issue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Licence issuance from a verified payment webhook: signing, provider adapters, product mapping, replay store (T-DIST-6)."
publish = false

[lints]
workspace = true

# **No HTTP, TLS or socket crate, deliberately.** This crate is a workspace
# member so the gate tests it, and it holds every decision the issuer makes.
# The HTTP shell that receives webhooks is `tools/licence-issuer`, which is
# excluded from the workspace exactly like `services/github-app`, so no HTTP
# dependency ever enters an engine build. `tests/no_network.rs` holds both the
# manifest and the sources to that.
[dependencies]
# Signing a licence with the founder's Ed25519 key. Already in Cargo.lock at 2.2.0.
ed25519-dalek = { version = "2.2.0" }
# Webhook signatures are HMAC-SHA256 for both providers. Already in Cargo.lock
# (crates/app-core verifies GitHub's webhook the same way).
hmac = "0.13.0"
# The replay store is one SQLite file, like every durable store here.
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# The licence format, `seal`, the plan set and the timestamp shape: T-DIST-4's.
thruline-licence = { version = "0.2.0", path = "../licence" }
# The product mapping file has comments (its PROVISIONAL header), so it is TOML.
# Already in Cargo.lock at 1.1.4 (crates/core reads its config with it).
toml = "1.1.4"
# `licence_id` is a ULID with a random part, so a second mint is unmistakable.
ulid = { workspace = true }

[dev-dependencies]
# Tests generate every key pair and webhook secret at run time, in memory.
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
tempfile = { workspace = true }
