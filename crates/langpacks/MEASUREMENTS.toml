# CAP: every Ruby finding is held at `warn` at emission — never `fail`.
#
# Operator ruling 2026-09-06 01:10 IST, verbatim: "ship Ruby, but every Ruby finding is
# capped at warn severity — never fail — until ambiguity is under 0.1%, with the
# cap and the measurement recorded beside it. No per-language budget. A detector
# over budget may inform; it may not accuse."
#
# The budget above ([basis].ambiguity_budget_pct) stays the ONLY budget; this is
# not a per-language one in disguise. What the miss changes is not the number
# Ruby is held to, but what a pack that misses it may do.
#
# Enforced by `Ruby::severity_cap()` and proved by construction in
# `tests/severity_cap.rs::a_ruby_finding_cannot_reach_fail`, which drives every
# detector rather than checking a list of expected severities.
# `the_cap_and_the_measurement_agree` fails if this line and the cap ever
# disagree in either direction.
#
# HALF OF THE RULING IS NOT ENFORCEABLE HERE: verify's `tests_pass::escalate`
# raises `skip_marker_added` from warn to fail downstream of anything this crate
# emits. That half is docs/tracks/G/INTERFACE-REQUESTS.md R8.
severity_cap       = "warn"
# OVER BUDGET, recorded rather than hidden. The brief this crate was built to
# asks for ambiguity under 0.1%; Ruby measures 0.1275% over 58,839 assertions.
# The residue is not a classifier error — every one of the 75 is a case where
# stripping produces the RIGHT shape and the raw text would have produced a
# wrong one, e.g. `assert_converted_to('\===', "<p>===</p>")`. Ruby test code
# simply carries more operators and matcher words inside literals than the
# other three. Lowering the budget to fit would make the number meaningless,
# so the number stands and the miss is named.
# `tests/measured_constants.rs::ruby_is_over_budget_and_it_is_recorded` fails
# if this ever silently becomes true without the entry being removed.
repos = [
    { repo = "faker", commit = "cca4184947e09fdd02afb8b89d25a9c8ebc7274e" },
    { repo = "jekyll", commit = "74d751339d3e534aa51d5d7b0640e9bd743509e4" },
    { repo = "puma", commit = "c63ee1079f39a40a156c65149e37a86404fc0d50" },
