[rename_similarity]
# The Jaccard threshold above which two test bodies are "the same test renamed".
# `verify` chose 0.5 against a Python/Rust/JS table. Measured here it is 0.4.
value = 0.4
basis = "pooled argmin of (mined-rename false accusation + rename+3-edits false accusation + coexisting-pair accidental pairing), the four languages weighted equally"
per_language = { java = 0.4, csharp = 0.55, ruby = 0.45, go = 0.4 }
# Pooled cost by candidate threshold; the chosen value is the argmin.
pooled_cost = [
    { t = 0.3, cost = 2.2442 },
    { t = 0.4, cost = 1.9079 },
    { t = 0.45, cost = 2.1582 },
    { t = 0.5, cost = 2.1134 },
    { t = 0.55, cost = 2.0882 },
    { t = 0.6, cost = 2.2387 },
    { t = 0.7, cost = 2.7028 },
    { t = 0.8, cost = 3.5017 },
]
