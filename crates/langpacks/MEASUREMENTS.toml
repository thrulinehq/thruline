# Measured constants

# Every constant in `src/measured.rs` is generated from this file, and
# `tests/measured_constants.rs` fails if the two disagree. Nothing here was
# chosen; each row records the corpus it came from and the command that
# reproduces it.
#
# The format follows `docs/perf-basis.toml`, which this repository already uses
# for the same reason: a number without a stamped basis is a number nobody can
# tell has gone stale. `thruline perf` prints "stale basis — re-measure" instead
# of a figure whose basis has moved; the equivalent here is that the gate test
# fails.
#
# Reproduce all of it with:
#   cargo run -p thruline-langpacks --release --bin measure

[basis]
measured_on = "2026-09-05"
# RE-MEASURED the same day, after `tamper::as_test_fn` began blanking comments
# structurally. That fix changes `body_tokens`, which is the input to `jaccard`,
# so the rename basis moved even though the chosen value did not. The four
# ambiguity rates are byte-identical across both runs (comment blanking does not
# touch `classify`), and the pooled cost at the argmin IMPROVED from 2.0586 to
# 1.9079 — the fix sharpened the separation the threshold is chosen against.
# Recording the new basis rather than leaving the old one behind an unchanged
# number is the `docs/perf-basis.toml` rule.
host = "macOS 25.1.0 arm64"
schema = "thruline-langpacks/measure/1"
corpus_root = "/private/tmp/claude-501/-Users-dev-thruline/00000000-0000-4000-8000-0000000000a1/scratchpad/corpus"
ambiguity_budget_pct = 0.1
assertion_floor = 5000
command = "cargo run -p thruline-langpacks --release --bin measure"


