[package]
publish = false
name = "thruline-langpacks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Detector coverage for Java, C#, Ruby and Go: runner parsers, shape classifier, tamper detectors."

[package.metadata.dist]
# `measure` is an internal corpus harness, not a public download.
dist = false

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tree-sitter = "0.25"
thruline-verify = { version = "0.2.0", path = "../verify" }
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-go = "0.23"

[dev-dependencies]
proptest = { workspace = true }

# The corpus measurement harness. Every constant in `src/measured.rs` is
# reproduced by running this against the corpus named in `MEASUREMENTS.toml`.
[[bin]]
name = "measure"
path = "src/bin/measure.rs"
