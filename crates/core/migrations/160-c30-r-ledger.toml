What a person did, as record (C30 R-LEDGER, C34 rulings Q1-Q17): notes (and the
note kept with an approval), second approvals, messages copied for the agent,
objections to a statement, Inbox hides, and pauses and path exclusions on their
own hash chain (scope `capture_hold`). Nothing here is a result: no row moves a
verdict, a coverage count, readiness or which approval stands.

Built on `74b06079`, the head of `hq-next/ui` after the merge of
`decisions/engine`, so it sits after the Decisions tables (orders 150 and 151)
and the founder upgrades once for all three.

Six tables, six indexes, eighteen append-only triggers, no ALTER of anything
already there. Cost (A193): nothing of its own; the bill is the existing
full-schema path's, for which `upgrade::estimate_phrase` gives "about 35 seconds" on
the 2.01 M-event corpus, and `thruline upgrade` is still the only thing that
may pay it. `thruline upgrade` now also counts every table before and after and
says whether rows before = rows after (C34 Q14).
"""

