[package]
publish = false
name = "thruline-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Local-first engine that rebuilds AI coding sessions into a hash-chained decision graph."

[lints]
workspace = true

[features]
# ON by default, so existing builds and workflows are unchanged.
#
# `--no-default-features` drops the local ONNX entailment backend, and with it
# the ONLY build-time network fetch in the tree: the `ort` crate downloads
# ONNX Runtime binaries while building. Without this feature the engine builds
# offline and deterministically, and the whole ledger/derive/packet/export path
# is unaffected — the NLI tier is a scoring backend, not a dependency of truth.
default = ["ort"]
ort = ["dep:ort", "dep:tokenizers"]

[dependencies]
thruline-policy = { version = "0.2.0", path = "../policy" }
thruline-verify = { workspace = true }
# A208 (MANDATE-v4 §14): encryption-at-rest for the protected snapshot store.
# The tree's existing crypto is signing (ed25519) and hashing (sha2) — neither
# can encrypt, so this is the declared minimal AEAD dependency (RustCrypto,
# audited family; rand_core 0.6, same line the tree already carries).
chacha20poly1305 = "0.10.1"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
ort = { version = "2.0.0-rc.13", optional = true }
rusqlite = { version = "0.40.1", features = ["bundled"] }
rustix = { version = "1.1.4", features = ["fs", "process", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sysinfo = "0.37"
thiserror = "2.0.19"
tokenizers = { version = "0.23.1", optional = true }
toml = "1.1.4"
tracing = "0.1.44"
tree-sitter = "0.25"
tree-sitter-go = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
ulid = "3.0.0"
ureq = { version = "3.3.0", default-features = false, features = ["json"] }
serde_jcs = "0.2.0"
tempfile = "3.27.0"
unicode-normalization = "0.1.25"
# B4 reads strict YAML events; input is already UTF-8, so no encoding backend.
yaml-rust2 = { version = "=0.13.0", default-features = false }

[target.'cfg(unix)'.dependencies]
# Safe process/account checks for the store hold and removal path guard.
nix = { version = "0.29.0", features = ["user", "signal", "process"] }

[dev-dependencies]
# C50 B1 qualifies the bundled backup API before production removal uses it.
rusqlite = { version = "0.40.1", features = ["backup"] }
insta = { version = "1.48.0", features = ["json"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
serde = { version = "1.0.229", features = ["derive"] }
proptest = "1"
serde_json_canonicalizer = "0.3"
# R-2026-09-24-21: the migration tests read the DDL task registry under
# `crates/core/migrations/`. Same version the crate already depends on, so the
# lockfile does not move.
toml = "1.1.4"
