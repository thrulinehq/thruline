# ---------------------------------------------------------------------------
# C27 on the founder's REAL store (~/.thruline; its ledger.db is 11.6 GB, and
# ~/.thruline in total is 26.0-26.3 GB, the figure the HQ status bar and
# Settings show; corrected in place under the C29 ruling, which found the two
# figures run together here; project thruline:
# 578 recordings, 162 threads), measured with scripts/hq/perf-check.mjs
# --start (it starts and stops its own server). (a) and (c) only read; (b)
# POSTs a load, which appends what the recordings hold that the store does
# not. Every hook and agent on the machine kept writing during these runs:
# Claude Code sessions, and Codex rollouts of 10-51 MB growing every few
