# ThruLine — the stamped-basis registry (P2b).
#
# Every performance figure the project quotes lives here, and every figure names
# the basis it was measured under. Nothing in this file says whether a figure is
# current: currency is DERIVED AT READ by `thruline perf`, which measures the
# conditions now and compares them axis by axis. That is the E2 ruling, and the
# reason it exists is that three sessions in a row (A186, A189, A190) were sent
# chasing a cost quoted from a figure whose measuring conditions had moved.
#
# Comparison axes (crates/core/src/perf_basis.rs :: AXES), all observable:
#
#   projects          SELECT COUNT(DISTINCT project_id) FROM events
#   events            SELECT COUNT(*) FROM events
#   sessions          SELECT COUNT(*) FROM sessions
#   nodes             SELECT COUNT(*) FROM nodes
#   project_heads     SELECT COUNT(*) FROM project_heads
#   node_projections  SELECT COUNT(*) FROM node_projection_heads
#   code_digest       build-time digest over crates/*/src, the manifests, Cargo.lock
#   profile           debug | release, from cfg!(debug_assertions)
#
# Everything else recorded on a basis — ledger_bytes, projects_table, commit,
# machine — is DESCRIPTIVE. It is here so a future session can reconstruct the
# conditions; it never decides currency. `ledger_bytes` in particular moves by
# hundreds of megabytes on a VACUUM without one corpus row changing.
#
# `recoverable = false` means the conditions were never written down completely
# enough to compare against. Such a basis can never match, so its figures are
# permanently re-measure-only. That is the truthful state of every figure this
# project took before this file existed, and recording it is the point (A190).
#
# To add a basis: run `scripts/perf-budget-suite.sh <ledger.db> <runs>` and paste
# the `[[basis]]` block it prints. The script emits it in exactly this shape.

version = 1

