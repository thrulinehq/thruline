# ---------------------------------------------------------------------------
# G2's schema change (2026-09-06)
# ---------------------------------------------------------------------------
#
# A basis of its own, because this figure is about `exec.db` — the BUILD-SPEC
# §11 store — and every other basis in this file describes `ledger.db`, the
# core's legacy store. The comparison axes above read `ledger.db`'s tables, so
# they cannot judge this figure's currency and `recoverable = false` says so
# rather than letting a mismatched axis imply a comparison that was never made.

[[basis]]
id = "B-G2-exec-db"
recorded = "2026-09-06"
recoverable = false
note = """
`~/.thruline/exec.db` copied to /tmp and measured there, so the live store was \
never opened by the probe: 639,311,872 bytes, 203,399 events, 44,075 sessions, \
schema v1 on entry. Debug build, commit is this session's head. Measured with \
`cargo run -p thruline-ledger --example migration_probe -- <copy>`, which is \
committed so the figure can be re-derived rather than trusted. Not recoverable \
against this file's axes: those count `ledger.db`'s rows and this is a \
different store.\
"""

[[figure]]
id = "exec-db-migrate-v1-to-v2"
label = "exec.db migration, v1 -> v2 (the gate's block ledger)"
basis = "B-G2-exec-db"
p50_ms = 2
note = """
2.2 ms to open and migrate 610 MB / 203,399 events / 44,075 sessions; 1.3 ms to \
open the same store once already migrated. The migration is a CREATE TABLE, an \
index and two triggers on a table that did not exist, so it rewrites no rows — \
the cost is independent of corpus size, which is why the two numbers are one \
millisecond apart.

**This is NOT an A193 migration and does not cost what one costs.** A193 governs \
`ledger.db` (7.4 GB here), where a DDL change costs a full pass, is charged to \
whichever process opens the ledger first, and makes every other command refuse \
until `thruline upgrade` runs. `exec.db` migrates automatically inside \
`Ledger::open` and refuses nothing. The two were conflated when this change was \
authorised, and the difference is recorded here because the authorisation was \
given against the larger cost.\
"""

