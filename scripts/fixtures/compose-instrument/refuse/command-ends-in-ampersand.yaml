# `SETUP && { <script>; }` is a SYNTAX ERROR when <script> ends in `&`. No
# pinned task has this shape; the point of the `sh -n` post-condition is that the
# next corpus revision may.
services:
  client:
    image: ${T_BENCH_TASK_DOCKER_CLIENT_IMAGE_NAME}
    container_name: ${T_BENCH_TASK_DOCKER_CLIENT_CONTAINER_NAME}
    command: [ "sh", "-c", "python3 server.py & sleep infinity &" ]
    environment:
      - TEST_DIR=${T_BENCH_TEST_DIR}
    volumes:
      - ${T_BENCH_TASK_LOGS_PATH}:${T_BENCH_CONTAINER_LOGS_PATH}
